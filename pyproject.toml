[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genpads"
version = "1.0.0"
description = "Generative politeness adaptive dialogue systems on Taskmaster-2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
train = ["torch>=2.2,<3", "transformers>=4.45,<6", "sentencepiece>=0.2,<1"]
metrics = ["nltk>=3.9,<4", "sacrebleu>=2.4,<3", "rouge-score>=0.1.2,<0.2"]
figures = ["matplotlib>=3.8,<4"]
test = ["pytest>=8,<10", "torch>=2.2,<3", "transformers>=4.45,<6"]

[project.scripts]
genpads = "genpads.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
